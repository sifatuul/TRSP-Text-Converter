<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TRSP Converter — Unicode Bangla to Bijoy/SutonnyMJ converter.">
<title>TRSP Converter</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/engine.js"></script>
<script src="js/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="assets/trsp-logo.png" alt="TRSP logo">
    <div class="brand-copy">
      <strong>TRSP Converter</strong>
      <small>Unicode → Bijoy <span>•</span> Publishing Utility</small>
    </div>
  </div>
  <div class="header-actions">
    <a class="site-link" href="https://the-royal-scientific-publications.com/" target="_blank" rel="noopener">TRSP Website ↗</a>
    <button id="clearBtn" class="clear-btn">Clear</button>
  </div>
</header>

<main>
  <section class="workspace" aria-label="Unicode to Bijoy converter">
    <article class="panel">
      <div class="panel-head">
        <b>Unicode Input</b>
        <button id="pasteBtn" class="tool-btn">Paste</button>
      </div>
      <div id="inputEditor" class="editor" contenteditable="true" spellcheck="false" data-placeholder="Paste or type Unicode Bangla here…"></div>
    </article>

    <div class="convert-area">
      <button id="convertBtn" class="convert-btn" title="Convert — Ctrl + Enter">
        <span>CONVERT</span><strong>→</strong>
      </button>
    </div>

    <article class="panel output-panel">
      <div class="panel-head">
        <b>Bijoy Output</b>
        <div class="output-tools">
          <button id="copyPlainBtn" class="tool-btn">Plain</button>
          <button id="copyBtn" class="copy-btn">Copy for Word</button>
        </div>
      </div>
      <div id="outputEditor" class="editor output-editor"></div>
    </article>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/trsp-logo.png" alt="TRSP logo">
      <div><strong>TRSP Converter</strong><span>Internal Publishing Utility</span></div>
    </div>
    <div class="credit">
      <span>Designed &amp; developed by</span>
      <strong>Md Sifatul Islam</strong>
      <em>BUET</em>
    </div>
    <div class="footer-copy">© 2026 The Royal Scientific Publications Ltd.</div>
  </div>
</footer>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
